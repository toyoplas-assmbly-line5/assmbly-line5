<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Toyoplas Manufacturing Indonesia - Assembly Line 5</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS CDN (Export Excel) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brandRed: '#E30613', brandBlue: '#002B66' } } } }
    </script>
    <style>.login-bg { background: linear-gradient(135deg, #002B66 0%, #00122e 100%); }</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center login-bg p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md text-center border border-gray-200 dark:border-gray-700">
            <div class="mb-6 flex justify-center">
                <div class="p-3 bg-white rounded-xl shadow-md border border-gray-100 inline-block">
                    <svg class="h-16 w-auto" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <text x="160" y="65" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-weight="bold" font-style="italic" font-size="68" fill="#E30613">70Y0</text>
                        <text x="160" y="102" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#002B66" letter-spacing="1">TOYOPLAS</text>
                    </svg>
                </div>
            </div>
            <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-1">Assembly Line 5</h2>
            <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Sistem Monitoring Produksi 3 Shift</p>
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">PILIH HAK AKSES / PERAN</label>
                    <select id="loginRole" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="operator">Operator (Mode Input Data)</option>
                        <option value="admin_leader">Admin / Leader (Mode Edit & Akses Penuh)</option>
                    </select>
                </div>
                <div id="passwordContainer" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">KATA SANDI (PASSWORD)</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="Masukkan kata sandi..." class="w-full pl-4 pr-10 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200 focus:outline-none">
                            <i id="togglePasswordIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div id="loginError" class="hidden text-red-500 text-xs font-semibold mt-2">
                    <i class="fas fa-exclamation-circle mr-1"></i> Kata sandi salah! Silakan coba lagi.
                </div>
                <button onclick="handleLogin()" type="button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 mt-2 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fas fa-sign-in-alt"></i> Masuk Dashboard
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="hidden min-h-screen flex flex-col">
        <header class="bg-brandBlue text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-white p-2 rounded-lg shadow-inner flex items-center justify-center">
                        <svg class="h-10 w-auto" viewBox="0 0 320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <text x="160" y="65" text-anchor="middle" font-family="'Brush Script MT', cursive, sans-serif" font-weight="bold" font-style="italic" font-size="68" fill="#E30613">70Y0</text>
                            <text x="160" y="102" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#002B66" letter-spacing="1">TOYOPLAS</text>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold tracking-wide">PT Toyoplas Manufacturing Indonesia</h1>
                        <p class="text-xs text-blue-200 flex items-center gap-2 flex-wrap">
                            <span>Assembly line 5</span><span>•</span>
                            <span id="roleBadge" class="bg-blue-800 px-2 py-0.5 rounded text-[10px] font-semibold uppercase text-yellow-300"></span><span>•</span>
                            <span id="syncStatus" class="text-emerald-300 text-[10px]"><i class="fas fa-circle-notch fa-spin"></i> Menghubungkan...</span>
                        </p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="shareGeneral()" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow">
                        <i class="fas fa-share-alt"></i> <span class="hidden sm:inline">Bagikan</span>
                    </button>
                    <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow">
                        <i class="fas fa-file-excel"></i> <span class="hidden sm:inline">Excel</span>
                    </button>
                    <button onclick="toggleDarkMode()" class="bg-blue-800 hover:bg-blue-700 text-yellow-300 p-2 rounded-lg text-sm transition shadow">
                        <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:inline"></i>
                    </button>
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow">
                        <i class="fas fa-power-off"></i> <span class="hidden sm:inline">Keluar</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            <!-- TOOLBAR -->
            <div class="bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border border-gray-200 dark:border-gray-700 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-4">
                    <div>
                        <label class="block text-xs text-gray-500 dark:text-gray-400">Pilih Tanggal:</label>
                        <input type="date" id="selectedDate" onchange="renderAll()" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm font-semibold">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 dark:text-gray-400">Pilih Shift Kerja:</label>
                        <select id="selectedShift" onchange="renderAll()" class="px-3 py-1.5 rounded-lg border border-gray-300 dark:border-gray-600 bg-blue-50 dark:bg-gray-700 text-sm font-bold text-blue-700 dark:text-blue-300">
                            <option value="Shift 1">Shift 1 (08:00 - 16:00)</option>
                            <option value="Shift 2">Shift 2 (16:00 - 23:00)</option>
                            <option value="Shift 3">Shift 3 (23:00 - 07:00)</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="exportBackupJSON()" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 text-gray-700 dark:text-gray-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1">
                        <i class="fas fa-download"></i> Backup
                    </button>
                    <label class="bg-gray
